<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelHub - Resident Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Navbar -->
  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i data-lucide="shield-check" class="w-8 h-8 text-indigo-400"></i>
        <span class="text-xl font-bold text-white">HostelHub Resident</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userInfo" class="text-xs text-slate-400 font-mono"></span>
        <button id="logoutBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Complaint Submission Form -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl h-fit">
      <h2 class="text-lg font-bold text-white mb-4 flex items-center space-x-2">
        <i data-lucide="alert-circle" class="w-5 h-5 text-indigo-400"></i>
        <span>Log Maintenance Grievance</span>
      </h2>

      <form id="issueForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Category</label>
          <select id="category" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="PLUMBING">Plumbing</option>
            <option value="ELECTRICAL">Electrical</option>
            <option value="INTERNET">Internet / Wi-Fi</option>
            <option value="CLEANING">Room Cleaning</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Priority (Determines SLA)</label>
          <select id="priority" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="LOW">Low (48h Resolution SLA)</option>
            <option value="MEDIUM" selected>Medium (24h Resolution SLA)</option>
            <option value="HIGH">High (12h Resolution SLA)</option>
            <option value="EMERGENCY">Emergency (4h Resolution SLA)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Description</label>
          <textarea id="description" required rows="3" placeholder="Describe the issue in detail..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-sm transition">
          Submit Ticket
        </button>
      </form>
    </div>

    <!-- Active Tickets List -->
    <div class="lg:col-span-2 bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
      <h2 class="text-lg font-bold text-white mb-4 flex items-center space-x-2">
        <i data-lucide="clock" class="w-5 h-5 text-indigo-400"></i>
        <span>My Ticket History</span>
      </h2>

      <div id="ticketsList" class="space-y-4">
        <p class="text-slate-400 text-sm">Loading tickets...</p>
      </div>
    </div>

  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    const token = localStorage.getItem('token');

    if (!token || user?.role !== 'RESIDENT') {
      window.location.href = '/index.html';
    }

    document.getElementById('userInfo').textContent = `${user.name} (Room ${user.roomNumber || 'N/A'})`;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/index.html';
    });

    // Fetch Tickets
    async function loadTickets() {
      try {
        const res = await fetch('/api/issues', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const tickets = await res.json();

        const container = document.getElementById('ticketsList');
        if (tickets.length === 0) {
          container.innerHTML = `<p class="text-slate-400 text-sm">No maintenance tickets submitted yet.</p>`;
          return;
        }

        container.innerHTML = tickets.map(t => `
          <div class="p-4 bg-slate-900/80 border border-slate-700/80 rounded-xl flex items-center justify-between">
            <div>
              <div class="flex items-center space-x-2 mb-1">
                <span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded ${
                  t.priority === 'EMERGENCY' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                  t.priority === 'HIGH' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                  'bg-slate-700 text-slate-300'
                }">${t.priority}</span>
                <span class="text-xs font-semibold text-indigo-300">${t.category}</span>
              </div>
              <p class="text-sm text-slate-200">${t.description}</p>
              <p class="text-[11px] text-slate-500 mt-1">Logged: ${new Date(t.createdAt).toLocaleString()}</p>
            </div>
            <div>
              <span class="px-3 py-1 text-xs font-bold rounded-full ${
                t.status === 'RESOLVED' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-indigo-500/20 text-indigo-300'
              }">${t.status}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    // Create Issue Form Submit
    document.getElementById('issueForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('category').value;
      const priority = document.getElementById('priority').value;
      const description = document.getElementById('description').value;

      try {
        const res = await fetch('/api/issues', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ category, priority, description })
        });

        if (res.ok) {
          document.getElementById('description').value = '';
          loadTickets();
        }
      } catch (err) {
        console.error(err);
      }
    });

    loadTickets();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
