<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelHub - Resident Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i data-lucide="building" class="w-8 h-8 text-indigo-500"></i>
        <span class="text-xl font-bold text-white">Resident Hub</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userName" class="text-xs text-slate-400 font-mono"></span>
        <button id="logoutBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition">Logout</button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-6 py-8 space-y-8">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- 🛠️ Maintenance Complaint Form -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-white flex items-center space-x-2">
          <i data-lucide="wrench" class="w-5 h-5 text-indigo-400"></i>
          <span>Report Maintenance Issue</span>
        </h2>
        
        <form id="issueForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Room Number</label>
            <input type="text" id="roomNumber" required placeholder="e.g. 302" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Issue Description</label>
            <textarea id="description" required rows="3" placeholder="Describe the problem..." class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Priority Level</label>
            <select id="priority" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="LOW">Low (SLA 48 Hours)</option>
              <option value="MEDIUM" selected>Medium (SLA 24 Hours)</option>
              <option value="HIGH">High (SLA 6 Hours)</option>
            </select>
          </div>
          <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-sm transition">Submit Ticket</button>
        </form>
      </div>

      <!-- 🎫 Visitor Gate Pass Request Form -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-white flex items-center space-x-2">
          <i data-lucide="qr-code" class="w-5 h-5 text-amber-400"></i>
          <span>Generate Visitor Gate Pass</span>
        </h2>

        <form id="passForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Visitor Name</label>
            <input type="text" id="visitorName" required placeholder="Full Name" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Visitor Phone</label>
            <input type="text" id="visitorPhone" required placeholder="10-digit mobile number" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Relation</label>
              <input type="text" id="relation" required placeholder="Parent/Friend" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Validity (Hours)</label>
              <input type="number" id="hoursValid" value="12" min="1" max="48" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
          </div>
          <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm transition">Generate Pass</button>
        </form>
      </div>

    </div>

    <!-- Active Gate Passes Section -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center space-x-2">
        <i data-lucide="ticket" class="w-5 h-5 text-amber-400"></i>
        <span>My Active Visitor Gate Passes</span>
      </h2>
      <div id="passesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-slate-400 text-sm">Loading gate passes...</p>
      </div>
    </div>

    <!-- Ticket History Section -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center space-x-2">
        <i data-lucide="history" class="w-5 h-5 text-indigo-400"></i>
        <span>My Raised Complaints</span>
      </h2>
      <div id="ticketsList" class="space-y-3">
        <p class="text-slate-400 text-sm">Loading complaint history...</p>
      </div>
    </div>

  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    const token = localStorage.getItem('token');

    if (!token || user?.role !== 'RESIDENT') {
      window.location.href = '/index.html';
    }

    document.getElementById('userName').textContent = `${user.name} (${user.email})`;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/index.html';
    });

    // 1. Submit Maintenance Ticket
    document.getElementById('issueForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const roomNumber = document.getElementById('roomNumber').value;
      const description = document.getElementById('description').value;
      const priority = document.getElementById('priority').value;

      try {
        const res = await fetch('/api/issues', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ roomNumber, description, priority })
        });

        if (res.ok) {
          document.getElementById('description').value = '';
          fetchMyTickets();
        }
      } catch (err) { console.error(err); }
    });

    // 2. Submit Gate Pass Request
    document.getElementById('passForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const visitorName = document.getElementById('visitorName').value;
      const visitorPhone = document.getElementById('visitorPhone').value;
      const relation = document.getElementById('relation').value;
      const hoursValid = document.getElementById('hoursValid').value;

      try {
        const res = await fetch('/api/passes/request', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ visitorName, visitorPhone, relation, hoursValid })
        });

        if (res.ok) {
          document.getElementById('visitorName').value = '';
          document.getElementById('visitorPhone').value = '';
          document.getElementById('relation').value = '';
          fetchMyPasses();
        }
      } catch (err) { console.error(err); }
    });

    // Fetch Resident's Passes
    async function fetchMyPasses() {
      try {
        const res = await fetch('/api/passes/my-passes', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const passes = await res.json();
        const container = document.getElementById('passesList');

        if (passes.length === 0) {
          container.innerHTML = `<p class="text-slate-400 text-sm col-span-full">No gate passes created yet.</p>`;
          return;
        }

        container.innerHTML = passes.map(p => `
          <div class="p-4 bg-slate-900 border border-slate-700/80 rounded-xl space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-sm font-bold text-white">${p.visitorName}</span>
              <span class="px-2 py-0.5 text-[10px] font-bold rounded ${p.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400'}">${p.status}</span>
            </div>
            <p class="text-xs text-slate-400">Relation: <span class="text-slate-200">${p.relation}</span></p>
            <div class="p-2 bg-slate-950 border border-slate-800 rounded font-mono text-center">
              <span class="text-[10px] text-slate-500 block">SCAN TOKEN</span>
              <span class="text-amber-400 font-bold text-xs select-all">${p.qrToken}</span>
            </div>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }

    // Fetch Resident's Complaints
    async function fetchMyTickets() {
      try {
        const res = await fetch('/api/issues/my-issues', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const tickets = await res.json();
        const container = document.getElementById('ticketsList');

        if (tickets.length === 0) {
          container.innerHTML = `<p class="text-slate-400 text-sm">No complaints submitted yet.</p>`;
          return;
        }

        container.innerHTML = tickets.map(t => `
          <div class="p-4 bg-slate-900 border border-slate-700/80 rounded-xl flex items-center justify-between">
            <div>
              <span class="text-xs font-mono text-indigo-400">Room ${t.roomNumber}</span>
              <p class="text-sm text-slate-200 font-medium">${t.description}</p>
            </div>
            <span class="px-2 py-1 text-xs font-bold rounded ${t.status === 'RESOLVED' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${t.status}</span>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }

    fetchMyPasses();
    fetchMyTickets();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
