<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warden Portal - HostelHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <nav class="bg-slate-800/80 border-b border-slate-700/80 backdrop-blur-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="font-bold text-white text-lg">HostelHub <span class="text-xs font-normal text-indigo-400">(Warden Dashboard)</span></div>
      <button id="logoutBtn" class="px-3 py-1.5 bg-rose-600/20 text-rose-300 border border-rose-500/30 rounded-xl text-xs hover:bg-rose-600 hover:text-white transition">Logout</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-6 flex-1 w-full">

    <div class="flex border-b border-slate-700">
      <button id="tabIssues" class="px-6 py-2.5 text-xs font-bold text-indigo-400 border-b-2 border-indigo-500">Student Complaints</button>
      <button id="tabGatePass" class="px-6 py-2.5 text-xs font-bold text-slate-400 hover:text-white">Gate Pass Requests</button>
    </div>

    <!-- ISSUES SECTION -->
    <div id="issuesSection" class="bg-slate-800 border border-slate-700/80 p-6 rounded-2xl space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h2 class="font-bold text-white text-sm">All Complaints</h2>
        <button onclick="fetchAllIssues()" class="text-xs text-indigo-400 hover:underline">Refresh</button>
      </div>
      <div id="allIssuesList" class="space-y-3 max-h-[600px] overflow-y-auto"></div>
    </div>

    <!-- GATE PASS SECTION -->
    <div id="gatePassSection" class="bg-slate-800 border border-slate-700/80 p-6 rounded-2xl space-y-4 shadow-xl hidden">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h2 class="font-bold text-white text-sm">Gate Pass Requests</h2>
        <button onclick="fetchAllPasses()" class="text-xs text-indigo-400 hover:underline">Refresh</button>
      </div>
      <div id="allPassesList" class="space-y-3 max-h-[600px] overflow-y-auto"></div>
    </div>

  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/index.html';

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/index.html';
    });

    const tabIssues = document.getElementById('tabIssues');
    const tabGatePass = document.getElementById('tabGatePass');
    const issuesSection = document.getElementById('issuesSection');
    const gatePassSection = document.getElementById('gatePassSection');

    tabIssues.addEventListener('click', () => {
      tabIssues.className = "px-6 py-2.5 text-xs font-bold text-indigo-400 border-b-2 border-indigo-500";
      tabGatePass.className = "px-6 py-2.5 text-xs font-bold text-slate-400 hover:text-white";
      issuesSection.classList.remove('hidden');
      gatePassSection.classList.add('hidden');
    });

    tabGatePass.addEventListener('click', () => {
      tabGatePass.className = "px-6 py-2.5 text-xs font-bold text-indigo-400 border-b-2 border-indigo-500";
      tabIssues.className = "px-6 py-2.5 text-xs font-bold text-slate-400 hover:text-white";
      gatePassSection.classList.remove('hidden');
      issuesSection.classList.add('hidden');
      fetchAllPasses();
    });

    async function fetchAllIssues() {
      const container = document.getElementById('allIssuesList');
      try {
        const res = await fetch('/api/issues/all', { headers: { 'Authorization': `Bearer ${token}` } });
        const issues = await res.json();
        container.innerHTML = issues.map(i => `
          <div class="p-3.5 bg-slate-900/60 border border-slate-700/60 rounded-xl space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-white">${i.title} (${i.student?.name || 'Student'})</span>
              <div class="flex gap-2">
                <button onclick="updateIssueStatus('${i._id}', 'IN_PROGRESS')" class="px-2 py-1 bg-blue-600/30 text-blue-300 rounded text-[10px]">In Progress</button>
                <button onclick="updateIssueStatus('${i._id}', 'RESOLVED')" class="px-2 py-1 bg-emerald-600/30 text-emerald-300 rounded text-[10px]">Resolve</button>
              </div>
            </div>
            <p class="text-[11px] text-slate-300">${i.description}</p>
          </div>`).join('');
      } catch (err) { container.innerHTML = `<p class="text-xs text-rose-400 text-center">Error loading issues.</p>`; }
    }

    async function updateIssueStatus(id, status) {
      await fetch(`/api/issues/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ status })
      });
      fetchAllIssues();
    }

    async function fetchAllPasses() {
      const container = document.getElementById('allPassesList');
      try {
        const res = await fetch('/api/pass/all', { headers: { 'Authorization': `Bearer ${token}` } });
        const passes = await res.json();
        container.innerHTML = passes.map(p => `
          <div class="p-3.5 bg-slate-900/60 border border-slate-700/60 rounded-xl space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-white">Student: ${p.student?.name || 'Unknown'} (${p.student?.roomNumber || 'N/A'})</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold ${p.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">${p.status}</span>
            </div>
            <p class="text-[11px] text-slate-300">Destination: ${p.destination} | Reason: ${p.reason}</p>
            <div class="flex items-center justify-between pt-2">
              <span class="text-[10px] text-slate-400">Out: ${p.outDate} | Return: ${p.inDate}</span>
              ${p.status === 'PENDING' ? `
                <div class="flex gap-2">
                  <button onclick="updatePassStatus('${p._id}', 'APPROVED')" class="px-2.5 py-1 bg-emerald-600/30 text-emerald-300 rounded text-[10px]">Approve</button>
                  <button onclick="updatePassStatus('${p._id}', 'REJECTED')" class="px-2.5 py-1 bg-rose-600/30 text-rose-300 rounded text-[10px]">Reject</button>
                </div>
              ` : ''}
            </div>
          </div>`).join('');
      } catch (err) { container.innerHTML = `<p class="text-xs text-rose-400 text-center">Error loading passes.</p>`; }
    }

    async function updatePassStatus(id, status) {
      await fetch(`/api/pass/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ status })
      });
      fetchAllPasses();
    }

    fetchAllIssues();
  </script>
</body>
</html>
