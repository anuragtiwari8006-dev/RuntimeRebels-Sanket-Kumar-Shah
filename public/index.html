<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelHub - Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl w-full max-w-md space-y-6 shadow-2xl">
    
    <div class="flex border-b border-slate-700">
      <button id="showLoginTab" class="w-1/2 py-2 text-center text-sm font-bold text-indigo-400 border-b-2 border-indigo-500">Sign In</button>
      <button id="showRegisterTab" class="w-1/2 py-2 text-center text-sm font-bold text-slate-400 hover:text-white">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="anurag@hostelhub.com" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>

      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition shadow-lg shadow-indigo-600/30">
        Sign In
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
        <input type="text" id="regName" required placeholder="Anurag Tiwari" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
        <input type="email" id="regEmail" required placeholder="anurag@hostelhub.com" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
        <input type="password" id="regPassword" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Role</label>
          <select id="regRole" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
            <option value="RESIDENT">Resident</option>
            <option value="WARDEN">Warden</option>
            <option value="SECURITY">Security Guard</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Room Number</label>
          <input type="text" id="regRoom" placeholder="102-B" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition shadow-lg shadow-indigo-600/30">
        Create Account
      </button>
    </form>

    <div id="authMsg" class="text-xs text-center hidden"></div>
  </div>

  <script>
    const loginTab = document.getElementById('showLoginTab');
    const registerTab = document.getElementById('showRegisterTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const authMsg = document.getElementById('authMsg');

    function redirectUser(role) {
      if (role === 'WARDEN') window.location.href = '/warden.html';
      else if (role === 'SECURITY') window.location.href = '/security.html';
      else window.location.href = '/resident.html';
    }

    loginTab.addEventListener('click', () => {
      loginTab.className = "w-1/2 py-2 text-center text-sm font-bold text-indigo-400 border-b-2 border-indigo-500";
      registerTab.className = "w-1/2 py-2 text-center text-sm font-bold text-slate-400 hover:text-white";
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      authMsg.classList.add('hidden');
    });

    registerTab.addEventListener('click', () => {
      registerTab.className = "w-1/2 py-2 text-center text-sm font-bold text-indigo-400 border-b-2 border-indigo-500";
      loginTab.className = "w-1/2 py-2 text-center text-sm font-bold text-slate-400 hover:text-white";
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      authMsg.classList.add('hidden');
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          redirectUser(data.user.role);
        } else {
          authMsg.innerText = data.message || 'Login failed.';
          authMsg.style.color = '#f87171';
          authMsg.classList.remove('hidden');
        }
      } catch (err) {
        authMsg.innerText = 'Network error.';
        authMsg.style.color = '#f87171';
        authMsg.classList.remove('hidden');
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            role: document.getElementById('regRole').value,
            roomNumber: document.getElementById('regRoom').value
          })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          redirectUser(data.user.role);
        } else {
          authMsg.innerText = data.message || 'Registration failed.';
          authMsg.style.color = '#f87171';
          authMsg.classList.remove('hidden');
        }
      } catch (err) {
        authMsg.innerText = 'Network error.';
        authMsg.style.color = '#f87171';
        authMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
