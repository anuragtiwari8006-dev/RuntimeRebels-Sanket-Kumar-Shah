<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelHub - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800/80 border border-slate-700/60 rounded-2xl p-8 shadow-2xl backdrop-blur-md">
    <!-- Header -->
    <div class="flex items-center justify-center space-x-3 mb-6">
      <i data-lucide="shield-check" class="w-10 h-10 text-indigo-400"></i>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">HostelHub</h1>
    </div>
    <p class="text-xs text-slate-400 text-center mb-8 uppercase tracking-widest font-mono">
      Campus Operations & Perimeter Security
    </p>

    <!-- Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Email Address</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="resident@hostelhub.com" 
          class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition"
        >
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••" 
          class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition"
        >
      </div>

      <button 
        type="submit" 
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2 text-sm"
      >
        <span>Sign In to Command Center</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div id="errorMessage" class="hidden mt-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-lg text-xs text-rose-400 text-center font-mono"></div>
  </div>

  <script>
    // Initialize icons safely
    if (window.lucide) {
      lucide.createIcons();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');

      errorDiv.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Login failed');
        }

        // Save token & user details
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Redirect based on user role
        if (data.user.role === 'RESIDENT') {
          window.location.href = '/resident.html';
        } else if (data.user.role === 'WARDEN') {
          window.location.href = '/warden.html';
        } else if (data.user.role === 'SECURITY') {
          window.location.href = '/security.html';
        }
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
