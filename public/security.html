<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Guard Dashboard - HostelHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-xl bg-amber-600 flex items-center justify-center font-bold text-white shadow-lg shadow-amber-500/20">
          SG
        </div>
        <div>
          <span class="font-bold text-lg text-white tracking-wide block">HostelHub</span>
          <span class="text-[10px] text-amber-400 font-semibold uppercase tracking-wider">Security Gate Control</span>
        </div>
      </div>
      
      <div class="flex items-center space-x-4">
        <div class="text-right hidden sm:block">
          <p id="userInfo" class="text-xs font-semibold text-slate-200">Loading...</p>
          <p class="text-[10px] text-slate-400">Security Guard</p>
        </div>
        <button id="logoutBtn" class="px-3.5 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition-colors">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    
    <!-- Top Action Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div>
        <h1 class="text-lg font-bold text-white">Active Gate Passes</h1>
        <p class="text-xs text-slate-400">Verify approved student passes and log campus exits/entries.</p>
      </div>
      <button onclick="fetchGuardPasses()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center space-x-2">
        <span>🔄 Refresh List</span>
      </button>
    </div>

    <!-- Passes Table / Cards -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div id="passesContainer" class="space-y-4">
        <p class="text-xs text-slate-500 text-center py-8">Loading approved passes...</p>
      </div>
    </div>

  </main>

  <script>
    const token = localStorage.getItem('token');
    let user = {};

    try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch (err) {}

    if (!token) window.location.href = '/index.html';

    document.getElementById('userInfo').innerText = `${user.name || 'Guard'} (Security desk)`;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/index.html';
    });

    // Fetch Active Passes for Security Guard
    async function fetchGuardPasses() {
      const container = document.getElementById('passesContainer');
      try {
        const res = await fetch('/api/pass/guard', {
          headers: { 
            'Authorization': `Bearer ${token}` 
          }
        });

        const passes = await res.json();

        if (!res.ok) {
          container.innerHTML = `<p class="text-xs text-rose-400 text-center py-6">${passes.message || 'Failed to load passes.'}</p>`;
          return;
        }

        if (!Array.isArray(passes) || passes.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12">
              <p class="text-sm font-semibold text-slate-400">No Active Gate Passes</p>
              <p class="text-xs text-slate-600 mt-1">There are currently no approved or checked-out passes needing security action.</p>
            </div>`;
          return;
        }

        container.innerHTML = passes.map(p => {
          const studentName = p.student?.name || 'Unknown Student';
          const roomNum = p.student?.roomNumber || 'N/A';
          const email = p.student?.email || '';

          return `
            <div class="p-5 bg-slate-950 border border-slate-800 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="space-y-1.5 flex-1">
                <div class="flex items-center space-x-3">
                  <span class="text-sm font-bold text-white">${studentName}</span>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">Room ${roomNum}</span>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                    p.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                    p.status === 'CHECKED_OUT' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' :
                    'bg-slate-800 text-slate-300'
                  }">${p.status}</span>
                </div>
                <p class="text-xs text-slate-300"><strong>Destination:</strong> ${p.destination} | <strong>Reason:</strong> ${p.reason}</p>
                <div class="flex flex-wrap gap-4 text-[11px] text-slate-400 pt-1">
                  <span><strong>Out:</strong> ${p.outDate}</span>
                  <span><strong>Return:</strong> ${p.inDate}</span>
                  ${p.securityCheckedOutAt ? `<span class="text-blue-400"><strong>Checked Out At:</strong> ${new Date(p.securityCheckedOutAt).toLocaleTimeString()}</span>` : ''}
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="flex items-center space-x-2 pt-2 md:pt-0 border-t md:border-t-0 border-slate-800">
                ${p.status === 'APPROVED' ? `
                  <button onclick="updateSecurityAction('${p._id}', 'CHECK_OUT')" 
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/20 transition-all">
                    Mark Exit (Out)
                  </button>
                ` : ''}

                ${p.status === 'CHECKED_OUT' ? `
                  <button onclick="updateSecurityAction('${p._id}', 'CHECK_IN')" 
                    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/20 transition-all">
                    Mark Entry (In)
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Guard Pass Fetch Error:', err);
        container.innerHTML = `<p class="text-xs text-rose-400 text-center py-6">Network error loading guard passes.</p>`;
      }
    }

    // Execute Check-Out / Check-In Action
    async function updateSecurityAction(passId, action) {
      const confirmText = action === 'CHECK_OUT' ? 'Confirm student EXIT from campus?' : 'Confirm student ENTRY back to campus?';
      if (!confirm(confirmText)) return;

      try {
        const res = await fetch(`/api/pass/${passId}/security`, {
          method: 'PATCH',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ action })
        });

        const data = await res.json();

        if (res.ok) {
          alert(data.message || 'Pass updated successfully!');
          fetchGuardPasses();
        } else {
          alert(`Error: ${data.message || 'Action failed.'}`);
        }
      } catch (err) {
        console.error('Security Action Error:', err);
        alert('Network error while processing security action.');
      }
    }

    // Initial fetch on page load
    fetchGuardPasses();
  </script>
</body>
</html>
